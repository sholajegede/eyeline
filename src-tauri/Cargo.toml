[package]
name = "eyeline"
version = "0.1.0"
description = "A teleprompter that keeps your script next to the camera"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "eyeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eyeline-core = { path = "../crates/eyeline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
